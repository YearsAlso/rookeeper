[workspace]
members = [
    "crates/rookeeper-cli",
    "crates/rookeeper-client",
    "crates/rookeeper-platform",
    "crates/rookeeper-protocol",
    "crates/rookeeper-server",
    "crates/rookeeper-storage",
]
resolver = "2"

[workspace.package]
authors = ["YearsAlso"]
edition = "2021"
license = "MIT"
repository = "https://github.com/YearsAlso/rookeeper"
rust-version = "1.82"
version = "0.1.0"

[workspace.dependencies]
anyhow = "=1.0.95"
bytes = { version = "=1.10.0", features = ["serde"] }
clap = { version = "=4.5.28", features = ["derive"] }
crc32fast = "=1.4.2"
fs2 = "=0.4.3"
serde = { version = "=1.0.217", features = ["derive"] }
thiserror = "=2.0.11"
tokio = { version = "=1.43.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt", "json"] }
